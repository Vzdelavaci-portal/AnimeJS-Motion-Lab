<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Magnetic Button | Anime.js</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <div class="background-glow background-glow-one"></div>
        <div class="background-glow background-glow-two"></div>

        <div class="content">

            <span class="series-label">
                ANIME.JS MOTION LAB
            </span>

            <h1>
                Magnetic
                <span>Button</span>
            </h1>

            <p>
                Move your cursor close to the button.
            </p>

            <div class="magnetic-area">

                <button
                    class="magnetic-button"
                    type="button"
                    aria-label="Explore the animation"
                >
                    <span class="button-glow"></span>

                    <span class="button-content">
                        <span class="button-text">
                            EXPLORE
                        </span>

                        <span class="button-arrow">
                            →
                        </span>
                    </span>
                </button>

            </div>

            <div class="status">
                <span class="status-dot"></span>
                Magnetic field active
            </div>

        </div>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
