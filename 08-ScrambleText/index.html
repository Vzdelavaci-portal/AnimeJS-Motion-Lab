<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Cyberpunk scramble text animation built with Anime.js."
    >

    <title>Scramble Text | AnimeJS Motion Lab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <div class="background-grid"></div>
        <div class="scanlines"></div>
        <div class="noise"></div>

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <section class="content">

            <div class="series-label">
                <span class="series-dot"></span>
                ANIME.JS MOTION LAB
            </div>

            <div class="project-number">
                PROJECT 08
            </div>

            <div class="terminal">

                <div class="terminal-top">

                    <div class="terminal-controls">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="terminal-title">
                        scramble.system
                    </div>

                    <div class="terminal-status">
                        ONLINE
                    </div>

                </div>

                <div class="terminal-body">

                    <div class="system-line">
                        <span class="prompt">&gt;</span>
                        INITIALIZING TEXT ENGINE...
                    </div>

                    <div class="scramble-wrapper">

                        <span
                            class="scramble-text"
                            data-text="ACCESS GRANTED"
                        >
                            ACCESS GRANTED
                        </span>

                        <span class="cursor"></span>

                    </div>

                    <div class="terminal-meta">

                        <span>
                            MODE: SCRAMBLE
                        </span>

                        <span>
                            ENGINE: ANIME.JS
                        </span>

                        <span>
                            STATUS: READY
                        </span>

                    </div>

                </div>

            </div>

            <div class="controls">

                <button class="next-button" type="button">
                    <span>SCRAMBLE AGAIN</span>
                    <span class="button-arrow">↻</span>
                </button>

                <div class="counter">
                    <span class="counter-current">01</span>
                    <span>/</span>
                    <span class="counter-total">05</span>
                </div>

            </div>

            <div class="footer-text">
                Random characters → controlled reveal → final message
            </div>

        </section>

        <div class="corner-label corner-left">
            HTML · CSS · JAVASCRIPT
        </div>

        <div class="corner-label corner-right">
            POWERED BY ANIME.JS
        </div>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
