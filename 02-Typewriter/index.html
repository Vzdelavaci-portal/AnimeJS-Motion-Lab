<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Creative typewriter text animation built with Anime.js."
    >

    <title>Typewriter | AnimeJS Motion Lab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <div class="background-grid"></div>

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <div class="floating-symbol symbol-one">
            { }
        </div>

        <div class="floating-symbol symbol-two">
            &lt;/&gt;
        </div>

        <div class="floating-symbol symbol-three">
            01
        </div>

        <section class="content">

            <div class="series-label">
                <span class="series-dot"></span>
                ANIME.JS MOTION LAB
            </div>

            <div class="terminal">

                <div class="terminal-header">

                    <div class="terminal-controls">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="terminal-title">
                        typewriter.js
                    </div>

                    <div class="terminal-language">
                        JS
                    </div>

                </div>

                <div class="terminal-body">

                    <div class="line-number">
                        01
                    </div>

                    <div class="typing-line">

                        <span class="code-keyword">
                            const
                        </span>

                        <span class="code-variable">
                            message
                        </span>

                        <span class="code-symbol">
                            =
                        </span>

                        <span class="quote">
                            "
                        </span>

                        <span
                            class="typed-text"
                            aria-live="polite"
                        ></span>

                        <span class="cursor"></span>

                        <span class="quote">
                            "
                        </span>

                        <span class="code-symbol">
                            ;
                        </span>

                    </div>

                </div>

                <div class="terminal-footer">

                    <div class="status">

                        <span class="status-indicator"></span>

                        <span class="status-text">
                            Typing animation active
                        </span>

                    </div>

                    <button
                        class="control-button"
                        type="button"
                        aria-label="Pause animation"
                    >
                        <span class="control-icon">Ⅱ</span>
                        <span class="control-text">Pause</span>
                    </button>

                </div>

            </div>

            <div class="project-info">

                <div>
                    <span class="project-number">
                        02
                    </span>

                    <h1>
                        Typewriter
                        <span>Effect</span>
                    </h1>
                </div>

                <p>
                    Dynamic text animation powered by Anime.js.
                </p>

            </div>

        </section>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
